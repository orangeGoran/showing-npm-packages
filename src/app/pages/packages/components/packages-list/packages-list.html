<!-- LOADING -->
@if (store.isLoading()) {
  <div class="w-full flex flex-col items-center justify-center min-h-[50vh]">
    Loading... Please wait.
  </div>
}

<!-- ERROR -->
@else if (store.hasError()) {
  <div class="w-full flex flex-col items-center justify-center min-h-[50vh]">
    Error: {{ store.errorMessage() }}
  </div>
}

<!-- EMPTY -->
@else if (store.filteredPackages().length === 0) {
  <div class="w-full flex flex-col items-center justify-center min-h-[50vh]">
    No packages found.
  </div>
}

<!-- PACKAGES LIST -->
@else {
  <div
    class="packages-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4"
  >
    @for (package of store.filteredPackages(); track package.id) {
      <div class="" [attr.data-testid]="'item-' + package.id">
        <app-packages-card [package]="package"></app-packages-card>
      </div>
    }
  </div>
}
